name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: |
          dotnet restore backend/ECommerce.API/ECommerce.API.csproj
          dotnet restore frontend/ECommerce.Web/ECommerce.Web.csproj

      - name: Build
        run: |
          dotnet build backend/ECommerce.API/ECommerce.API.csproj --configuration Release --no-restore
          dotnet build frontend/ECommerce.Web/ECommerce.Web.csproj --configuration Release --no-restore
